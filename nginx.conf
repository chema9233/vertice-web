# ---------------------------------------------------------------------------
# nginx.conf — Configuración para Academia Vértice
# Sirve el bundle autocontenido desde cualquier subdominio/subdirectorio.
# No hay rutas relativas que romper: todo (CSS, JS, imágenes, fuentes)
# va embebido en index.html.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;
    charset utf-8;

    # --- Compresión ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # --- Ruta principal: fallback a index.html ---
    # Aunque este sitio es una sola página, el fallback evita cualquier 404
    # si se accede con una ruta tipo /vertice/ o /otra-ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Caché larga para assets estáticos ---
    location ~* \.(jpe?g|png|webp|gif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ /index.html;
    }

    # --- Seguridad básica ---
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}